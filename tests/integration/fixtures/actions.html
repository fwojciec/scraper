<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Action Test Page</title>
  </head>
  <body>
    <h1>Action Tests</h1>
    <form id="test-form">
      <label for="name-input">Name:</label>
      <input type="text" id="name-input" name="name" />

      <label for="email-input">Email:</label>
      <input type="email" id="email-input" name="email" />

      <label for="color-select">Color:</label>
      <select id="color-select" name="color">
        <option value="">Choose...</option>
        <option value="red">Red</option>
        <option value="green">Green</option>
        <option value="blue">Blue</option>
      </select>

      <input type="file" id="file-input" name="file" />

      <button type="button" id="greet-btn">Greet</button>
      <button type="button" id="alert-btn">Alert</button>
      <button type="button" id="confirm-btn">Confirm</button>
      <button type="button" id="prompt-btn">Prompt</button>
      <button type="submit" id="submit-btn">Submit</button>
    </form>

    <div id="output"></div>
    <div id="typed-output"></div>
    <div id="submit-output"></div>
    <div id="keypress-output"></div>
    <div id="file-output"></div>
    <div id="dialog-output"></div>

    <script>
      document.getElementById("greet-btn").addEventListener("click", () => {
        const name = document.getElementById("name-input").value;
        const output = document.getElementById("output");
        output.textContent = name ? `Hello, ${name}!` : "Please enter a name.";
      });

      // Track keydown events on name input for type/press-key testing
      document.getElementById("name-input").addEventListener("keydown", (e) => {
        document.getElementById("keypress-output").textContent = "keydown:" + e.key;
      });

      // Track input events for type testing
      document.getElementById("name-input").addEventListener("input", () => {
        document.getElementById("typed-output").textContent = "typed:" +
          document.getElementById("name-input").value;
      });

      // Track form submission
      document.getElementById("test-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const name = document.getElementById("name-input").value;
        const color = document.getElementById("color-select").value;
        document.getElementById("submit-output").textContent =
          `submitted: name=${name}, color=${color}`;
      });

      // Track file upload
      document.getElementById("file-input").addEventListener("change", (e) => {
        const files = e.target.files;
        if (files.length > 0) {
          document.getElementById("file-output").textContent = "file:" + files[0].name;
        }
      });

      // Dialog buttons
      document.getElementById("alert-btn").addEventListener("click", () => {
        alert("test alert");
        document.getElementById("dialog-output").textContent = "alert:done";
      });
      document.getElementById("confirm-btn").addEventListener("click", () => {
        const result = confirm("test confirm");
        document.getElementById("dialog-output").textContent = "confirm:" + result;
      });
      document.getElementById("prompt-btn").addEventListener("click", () => {
        const result = prompt("test prompt", "default");
        document.getElementById("dialog-output").textContent = "prompt:" + result;
      });
    </script>
  </body>
</html>
